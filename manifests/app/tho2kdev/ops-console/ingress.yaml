apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-console
  namespace: tho2kdev
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ops-console.tho2kdev.com
      secretName: tho2kdev-origin-tls
  rules:
    - host: ops-console.tho2kdev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ops-console-service
                port:
                  number: 80
    - host: www.ops-console.tho2kdev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ops-console-service
                port:
                  number: 80