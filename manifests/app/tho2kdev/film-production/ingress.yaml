apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: film-production
  namespace: tho2kdev
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - film-production.tho2kdev.com
      secretName: tho2kdev-origin-tls
  rules:
    - host: film-production.tho2kdev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: film-production-service
                port:
                  number: 80
    - host: www.film-production.tho2kdev.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: film-production-service
                port:
                  number: 80