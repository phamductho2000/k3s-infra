apiVersion: v1
kind: Namespace
metadata:
  name: tho2kdev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-console-config
  namespace: tho2kdev
data:
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-console-deployment
  namespace: tho2kdev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ops-console
  template:
    metadata:
      labels:
        app: ops-console
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: ops-console
          image: ghcr.io/phamductho2000/ops-console:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: ops-console-config
            - secretRef:
                name: ops-console-secret
                optional: true
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ops-console-service
  namespace: tho2kdev
spec:
  type: ClusterIP
  selector:
    app: ops-console
  ports:
    - port: 80
      targetPort: 3000