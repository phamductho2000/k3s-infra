apiVersion: v1
kind: Namespace
metadata:
  name: trangsinh
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trangsinh-config
  namespace: trangsinh
data:
  NODE_ENV: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trangsinh-deployment
  namespace: trangsinh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trangsinh
  template:
    metadata:
      labels:
        app: trangsinh
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: trangsinh
          image: ghcr.io/phamductho2000/trangsinh:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: trangsinh-config
            - secretRef:
                name: trangsinh-secret
                optional: true
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trangsinh-service
  namespace: trangsinh
spec:
  type: ClusterIP
  selector:
    app: trangsinh
  ports:
    - port: 80
      targetPort: 3000